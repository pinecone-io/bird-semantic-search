name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile sources
        run: python -m compileall -q .

      - name: Run tests
        # test_app.py drives the Streamlit app against a live Pinecone index
        # (via query_db + st.secrets["pinecone_api_key"]), so it needs a real
        # API key and a populated index and can't run in CI. The deterministic
        # unit tests (metrics + app setup) do run here.
        run: pytest tests/ --ignore=tests/test_app.py -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run pip-audit (fail on vulnerabilities)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
